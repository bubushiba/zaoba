services:
  - type: web
    name: zaoba
    env: python
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      daphne -b 0.0.0.0 -p 8000 bushiba.asgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: bushiba.settings
      - key: SECRET_KEY
        generateValue: true