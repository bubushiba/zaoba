{%extends 'admin/muban.html' %}
{% load static %}

{% block title %}管理员登录{% endblock %}

{% block css %}
<style>
    /* 页面整体背景设置及动画 */
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f8ff; /* 更改后的背景颜色，淡蓝色 */
        animation: changeBgColor 10s infinite alternate; /* 添加背景颜色变化动画，时长10秒，无限循环，交替变化 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    /* 背景颜色变化动画关键帧定义 */
    @keyframes changeBgColor {
        from {
            background-color: #f0f8ff;
        }
        to {
            background-color: #e6e6fa; /* 动画结束时的背景颜色，淡紫色 */
        }
    }

    /* 标题样式 */
    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
        font-size: 36px;
    }

    /* 登录容器样式 */
      .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 300px;
            animation: fadeIn 1s ease; /* 添加登录容器淡入动画，时长1秒，缓动效果 */
        }

        /* 登录容器淡入动画关键帧定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* 登录按钮样式及动画 */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease; /* 添加过渡效果，让动画更平滑 */
            position: relative; /* 用于定位伪元素 */
            overflow: hidden; /* 隐藏超出按钮范围的内容 */
        }

        button:hover {
            background-color: #0056b3;
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2); /* 按钮悬停时的发光效果颜色 */
            transition: all 0.3s ease; /* 过渡效果 */
            z-index: 1; /* 确保在按钮内容之上 */
        }

        button:hover::before {
            left: 0; /* 悬停时显示发光效果 */
        }

        button span {
            position: relative;
            z-index: 2; /* 确保文字在发光效果之上 */
        }
</style>
{% endblock %}

{% block content %}
<h1>早吧网站管理系统</h1>
<div class="login-container">
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label>管理员</label>
            <input type="text" name="user">
            <label>密码</label>
            <input type="password" name="password">
        </div>
        <div class="form-group">
            <label for="id_code">验证码</label>
            <div class="row">
                <div class="col-xs-7">
                    <input type="text" name="code" class="form-control" placeholder="验证码" required="" id="id_code">
                    <span style="color: red;"></span>
                </div>
                <div class="col-xs-5">
                    <img id="image_code" src="/admin/image/code/">
                </div>
            </div>
        </div>
        <button type="submit">
            <span>登录</span>
        </button>
    </form>
</div>
{% endblock %}

{% block js %}
<script src="{% static 'js/jquery-3.6.8.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-3.4.1/js/bootstrap.min.js' %}"></script>
<script>
    // 点击验证码图片刷新
    document.getElementById('image_code').onclick = function() {
        this.src = '/admin/image/code/?t=' + new Date().getTime();
    };
</script>
{% endblock %}
