{% extends 'admin/muban.html' %}

{% block title %}添加作品{% endblock %}

{% block css %}
<!-- 描述框 -->
<style>
/* 整体容器样式 */
.container {
  padding: 20px;
  font-family: Arial, sans-serif;
}

/* 输入区域样式 */
.input-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 文本输入框样式 */
#id_description {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  resize: vertical;
}

/* 上传按钮样式 */
.upload-button {
  padding: 10px 15px;
  background-color: #007BFF;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
}

.upload-button:hover {
  background-color: #0056b3;
}

/* 隐藏文件输入框 */
.hidden {
  display: none;
}

/* 图片预览区域样式 */
.image-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.image-preview img {
  max-width: 100px;
  max-height: 100px;
  object-fit: cover;
  border: 1px solid #ddd;
  border-radius: 4px;
}



</style>
<style>
/* 新增样式 */
.image-wrapper {
    position: relative;
    display: inline-block;
    margin: 10px;
}

.delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: rgba(255, 0, 0, 0.7);
    color: white;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
}

.delete-btn:hover {
    background: rgba(255, 0, 0, 0.9);
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title"> 添加作品 </h3>
        </div>
        <div class="panel-body">
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label>描述</label>
                    <div class="container">
                        <div class="input-section">
                            <textarea id="id_description" rows="3" placeholder="描述" name="description"></textarea>
                            <label for="file-input" class="upload-button">
                                <i class="fa-solid fa-upload"></i> 上传图片
                            </label>
                            <input type="file" id="file-input" name="images" accept="image/*" class="hidden" multiple>
                        </div>
                        <div id="preview-container" class="image-preview"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">提交</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}


{% block js %}
<!-- 添加图片 -->
<script>
const textInput = document.getElementById('id_description');
const fileInput = document.getElementById('file-input');
const previewContainer = document.getElementById('preview-container');

let fileStore = new DataTransfer();

// 创建删除按钮（修正文件名匹配问题）
function createDeleteButton(file) {
    const btn = document.createElement('button');
    btn.className = 'delete-btn';
    btn.innerHTML = '×';
    btn.type = 'button';

    btn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();

        // 通过文件对象直接比对（而非文件名）
        const index = Array.from(fileStore.files).findIndex(
            storedFile => storedFile === file
        );

        if (index > -1) {
            fileStore.items.remove(index);
            fileInput.files = fileStore.files;
            updatePreview();
        }
    };
    return btn;
}

// 更新预览函数（直接传递文件对象）
function updatePreview() {
    previewContainer.innerHTML = '';
    Array.from(fileStore.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = e.target.result;

            // 直接绑定文件对象到删除按钮
            wrapper.appendChild(img);
            wrapper.appendChild(createDeleteButton(file));
            previewContainer.appendChild(wrapper);
        };
        reader.readAsDataURL(file);
    });
}

// 文件选择事件
fileInput.addEventListener('change', (e) => {
    Array.from(e.target.files).forEach(file => {
        fileStore.items.add(file);
    });
    fileInput.files = fileStore.files;
    updatePreview();
});

// 粘贴事件处理
textInput.addEventListener('paste', (e) => {
    const items = (e.clipboardData || window.clipboardData).items;

    Array.from(items).forEach(item => {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            const renamedFile = new File([file], `paste_${Date.now()}.png`, {
                type: 'image/png'
            });
            fileStore.items.add(renamedFile);
            fileInput.files = fileStore.files;
            updatePreview();
        }
    });
});
</script>
{% endblock %}
