{% extends 'user/muban.html' %}

{% block title %}更新头像{% endblock %}

{% block css %}
<style>
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
        }

        #image-container {
            width: 500px;
            height: 500px;
            border: 1px solid #ccc;
            position: relative;
        }

        #uploaded-image {
            max-width: 100%;
            max-height: 100%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #selection-box {
            position: absolute;
            border: 2px dashed red;
            cursor: move;
            user-select: none;
        }

        .resize-handle.bottom-right {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: blue;
            border-radius: 50%;
            bottom: -5px;
            right: -5px;
            cursor: nwse-resize;
        }

        #preview-container {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #333;
        }

        #preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
{% endblock %}

{% block content %}
<div class="main-container">
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="image-container">
            <img id="uploaded-image" src="/media/{{ request.session.info.avatar }}" alt="上传头像">
            <div id="selection-box">
                <div class="resize-handle bottom-right"></div>
            </div>
        </div>
        <button id="upload-btn">选择图片</button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="preview-container">
            <img id="preview-image" src="#" alt="Preview">
        </div>
        <button id="update-btn">更新头像</button>
    </div>
</div>
<input type="file" id="image-upload" accept="image/*" style="display: none;">
{% endblock %}

{% block js %}
<script>
        let isDragging = false;
        let startX, startY;
        let offsetX = 0, offsetY = 0;
        let isResizing = false;
        let imgNaturalWidth, imgNaturalHeight;
        let scaleRatio = 1;
        const selectionBox = document.getElementById('selection-box');
        const uploadedImage = document.getElementById('uploaded-image');
        const previewImage = document.getElementById('preview-image');
        let imgLeft, imgTop, imgRight, imgBottom;

        // 选择图片
        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('image-upload').click();
        });

        document.getElementById('image-upload').addEventListener('change', uploadImage);

        function uploadImage() {
            const input = document.getElementById('image-upload');
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    uploadedImage.src = e.target.result;
                    uploadedImage.onload = function () {
                        imgNaturalWidth = this.naturalWidth;
                        imgNaturalHeight = this.naturalHeight;
                        const containerWidth = 500;
                        const containerHeight = 500;
                        scaleRatio = Math.min(containerWidth / imgNaturalWidth, containerHeight / imgNaturalHeight);
                        const newWidth = imgNaturalWidth * scaleRatio;
                        const newHeight = imgNaturalHeight * scaleRatio;

                        uploadedImage.style.width = newWidth + 'px';
                        uploadedImage.style.height = newHeight + 'px';

                        imgLeft = (containerWidth - newWidth) / 2;
                        imgTop = (containerHeight - newHeight) / 2;
                        imgRight = imgLeft + newWidth;
                        imgBottom = imgTop + newHeight;

                        selectionBox.style.width = '100px';
                        selectionBox.style.height = '100px';
                        selectionBox.style.left = (containerWidth - 100) / 2 + 'px';
                        selectionBox.style.top = (containerHeight - 100) / 2 + 'px';

                        updatePreview();
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePreview() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const rect = uploadedImage.getBoundingClientRect();
            const scaleX = imgNaturalWidth / rect.width;
            const scaleY = imgNaturalHeight / rect.height;

            const boxLeft = parseInt(selectionBox.style.left) - imgLeft;
            const boxTop = parseInt(selectionBox.style.top) - imgTop;
            const boxWidth = parseInt(selectionBox.style.width);
            const boxHeight = parseInt(selectionBox.style.height);

            const sourceX = boxLeft * scaleX;
            const sourceY = boxTop * scaleY;
            const sourceWidth = boxWidth * scaleX;
            const sourceHeight = boxHeight * scaleY;

            canvas.width = 300;
            canvas.height = 300;
            ctx.drawImage(
                uploadedImage,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, 300, 300
            );

            previewImage.src = canvas.toDataURL('image/png');
        }

        // 拖动逻辑
        selectionBox.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                startX = e.clientX;
                startY = e.clientY;
            } else {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                offsetX = parseInt(selectionBox.style.left);
                offsetY = parseInt(selectionBox.style.top);
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let newLeft = offsetX + dx;
                let newTop = offsetY + dy;
                newLeft = Math.max(imgLeft, Math.min(newLeft, imgRight - parseInt(selectionBox.style.width)));
                newTop = Math.max(imgTop, Math.min(newTop, imgBottom - parseInt(selectionBox.style.height)));
                selectionBox.style.left = newLeft + 'px';
                selectionBox.style.top = newTop + 'px';
                updatePreview();
            } else if (isResizing) {
                // 获取选择框左上角在屏幕上的坐标
                const selectionRect = selectionBox.getBoundingClientRect();
                const selectionTopLeftX = selectionRect.x;      // 获取x坐标
                // 计算选择框新的大小
                let newSize = e.clientX - selectionTopLeftX;
                newSize = Math.min(newSize, imgRight - parseInt(selectionBox.style.left), imgBottom - parseInt(selectionBox.style.top));
                selectionBox.style.width = newSize + 'px';
                selectionBox.style.height = newSize + 'px';
                updatePreview();
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
        });

</script>
<script>
        // 修改后的提交逻辑
        document.getElementById('update-btn').addEventListener('click', function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 原有裁剪计算逻辑保持不变
            const rect = uploadedImage.getBoundingClientRect();
            const scaleX = imgNaturalWidth / rect.width;
            const scaleY = imgNaturalHeight / rect.height;

            const boxLeft = parseInt(selectionBox.style.left) - imgLeft;
            const boxTop = parseInt(selectionBox.style.top) - imgTop;
            const boxWidth = parseInt(selectionBox.style.width);
            const boxHeight = parseInt(selectionBox.style.height);

            const sourceX = boxLeft * scaleX;
            const sourceY = boxTop * scaleY;
            const sourceWidth = boxWidth * scaleX;
            const sourceHeight = boxHeight * scaleY;

            canvas.width = 300;
            canvas.height = 300;
            ctx.drawImage(
                uploadedImage,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, 300, 300
            );

            canvas.toBlob((blob) => {
                // 创建FormData对象
                const formData = new FormData();
                formData.append('cropped_image', blob, 'avatar.png');

                // 使用jQuery AJAX
                $.ajax({
                    url: "/user/avatar/",
                    type: "POST",
                    data: formData,
                    processData: false,  // 重要：禁止处理数据
                    contentType: false,  // 重要：不设置内容类型
                    dataType: "json",
                    success: function(res) {
                        if(res.status) {
                            alert("头像更新成功");
                            window.location.href = "/user/welcome/";  // 跳转到个人页面
                        } else {
                            // 显示错误信息（根据你的字段结构调整）
                            $.each(res.error, function(name, data) {
                                $("[name='" + name + "']").next().text(data[0]);
                            });
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error("Error:", error);
                        alert("更新失败，请重试");
                    }
                });
            }, 'image/png');
        });
</script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
{% endblock %}
